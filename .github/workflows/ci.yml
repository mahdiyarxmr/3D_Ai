name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  repo-guards:
    name: Repository guards (separation + locales)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Product separation and localization guards
        run: node --test "tests/*.test.mjs"

  web-backend:
    name: LunaAI Web backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/backend/package-lock.json
      - run: npm ci
      - name: Tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/web-backend-tests.log
      - name: Annotate test failures
        if: failure()
        run: |
          grep -E "^not ok|error:|AssertionError" /tmp/web-backend-tests.log | head -30 | while IFS= read -r line; do
            echo "::error title=web-backend::$line"
          done
          exit 1

  web-frontend:
    name: LunaAI Web frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/frontend/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Type check and production build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/web-frontend-build.log
      - name: Annotate build failures
        if: failure()
        run: |
          grep -E "error TS|error during build|failed" /tmp/web-frontend-build.log | head -30 | while IFS= read -r line; do
            echo "::error title=web-frontend::$line"
          done
          exit 1

  pc-windows:
    name: LunaAI PC (native WPF, Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/pc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore LunaAI.PC.sln
      - name: Build
        shell: pwsh
        run: |
          $log = dotnet build LunaAI.PC.sln --configuration Release --no-restore 2>&1 | Out-String
          $log | Write-Host
          if ($LASTEXITCODE -ne 0) {
            ($log -split "`n" | Where-Object { $_ -match ': error ' } | Select-Object -First 40) | ForEach-Object {
              Write-Host "::error title=pc-build::$($_.Trim())"
            }
            exit 1
          }
      - name: Test
        shell: pwsh
        run: |
          $log = dotnet test LunaAI.PC.sln --configuration Release --no-build --logger "console;verbosity=normal" 2>&1 | Out-String
          $log | Write-Host
          if ($LASTEXITCODE -ne 0) {
            ($log -split "`n" | Where-Object { $_ -match 'Failed |error |Assert\.' } | Select-Object -First 40) | ForEach-Object {
              Write-Host "::error title=pc-test::$($_.Trim())"
            }
            exit 1
          }
      - name: Publish native executable
        shell: pwsh
        run: |
          $log = dotnet publish src/LunaAI.PC.App/LunaAI.PC.App.csproj --configuration Release --runtime win-x64 --self-contained false --output ./artifacts/pc 2>&1 | Out-String
          $log | Write-Host
          if ($LASTEXITCODE -ne 0) {
            ($log -split "`n" | Where-Object { $_ -match ': error ' } | Select-Object -First 40) | ForEach-Object {
              Write-Host "::error title=pc-publish::$($_.Trim())"
            }
            exit 1
          }
      - name: Verify the published output is a native executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem ./artifacts/pc -Filter LunaAI.PC.exe -Recurse -ErrorAction SilentlyContinue
          if (-not $exe) { Write-Host "::error title=pc-publish::LunaAI.PC.exe was not produced"; exit 1 }
          $forbidden = Get-ChildItem ./artifacts/pc -Recurse -Include *.html,*.css,*.ts,*.tsx,*.jsx -ErrorAction SilentlyContinue
          if ($forbidden) {
            Write-Host "::error title=pc-publish::web assets found in the native desktop build: $($forbidden.Name -join ', ')"
            exit 1
          }
          Write-Host "LunaAI.PC.exe published successfully: $($exe.FullName)"
      - uses: actions/upload-artifact@v4
        with:
          name: lunaai-pc-win-x64
          path: apps/pc/artifacts/pc
          if-no-files-found: error

  pc-core-linux:
    name: LunaAI PC core (portable, Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and test the portable core
        shell: bash
        run: |
          set -o pipefail
          log=$(dotnet test tests/LunaAI.PC.Tests/LunaAI.PC.Tests.csproj --configuration Release 2>&1) || {
            echo "$log" | tail -200
            echo "$log" | grep -E ": error |Failed " | head -40 | while IFS= read -r line; do
              echo "::error title=pc-core-linux::$(echo "$line" | sed 's/%/%25/g')"
            done
            exit 1
          }
          echo "$log" | tail -40
